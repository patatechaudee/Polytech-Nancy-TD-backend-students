openapi: 3.0.3
info:
    title: TODO API
    version: 1.0.0
    description: API de gestion d'une TODO List.
servers:
    -   url: http://localhost:8080
        description: Serveur local de développement

tags:
    -   name: tasks
        description: Opérations sur les tâches

paths:
    /tasks:
        get:
            tags: [ tasks ]
            summary: Liste des tâches
            operationId: getTasks
            parameters:
                -   in: query
                    name: todo-only
                    schema:
                        type: boolean
                    description: Si vrai, ne retourne que les tâches non terminées
            responses:
                '200':
                    description: Liste des tâches récupérée
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Task'
                '204':
                    description: Aucune tâche trouvée
        post:
            tags: [ tasks ]
            summary: Créer une tâche
            operationId: createTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '201':
                    description: Tâche créée avec succès
                    headers:
                        Location:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'

    /tasks/{id}:
        parameters:
            -   in: path
                name: id
                required: true
                schema:
                    type: integer
                    minimum: 1
        get:
            tags: [ tasks ]
            summary: Récupérer une tâche
            description: Récupérer une tâche par son identifiant
            operationId: getTaskById
            responses:
                '200':
                    description: Tâche trouvée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
                '404':
                    description: Tâche non trouvée
        put:
            tags: [ tasks ]
            summary: Modifier une tâche
            operationId: updateTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '204':
                    description: Tâche modifiée
                '404':
                    description: Tâche non trouvée
        delete:
            tags: [ tasks ]
            summary: Supprimer une tâche
            operationId: deleteTask
            responses:
                '204':
                    description: Tâche supprimée
                '404':
                    description: Tâche non trouvée

components:
    schemas:
        Task:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                description:
                    type: string
                    nullable: true
                done:
                    type: boolean
            required:
                - id
                - title